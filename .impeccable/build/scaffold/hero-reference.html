<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: homepage-playbook.png</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jolly+Lodger:wght@400&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#f8f8f8}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:1505px">
  <div class="r-navigation region chrome" data-region="navigation"><!-- white navigation strip --></div>
  <div class="r-brand region text" data-region="brand"><!-- joinjulia.com --><p style="font-size:var(--r-brand-font);line-height:1.05;margin:0">brand</p></div>
  <div class="r-story-nav region control" data-region="story-nav"><!-- My story navigation link: rebuild the control's chrome from the crop (comp-spec.mjs --crop story-nav); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-priorities-nav region control" data-region="priorities-nav"><!-- Priorities navigation link: rebuild the control's chrome from the crop (comp-spec.mjs --crop priorities-nav); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-hero-ground region chrome" data-region="hero-ground"><!-- solid royal blue hero background --></div>
  <div class="r-headline region text" data-region="headline"><!-- DEMOCRATS ON OFFENSE athletic white headline --><p style="font-size:var(--r-headline-font);font-family:var(--r-headline-family),sans-serif;font-weight:var(--r-headline-weight);line-height:1.05;margin:0">headline</p></div>
  <div class="r-candidate region text" data-region="candidate"><!-- JULIA ADELE CALLAHAN white athletic name --><p style="font-size:var(--r-candidate-font);line-height:1.05;margin:0">candidate</p></div>
  <div class="r-office region text" data-region="office"><!-- For Bibb County Democratic Party Chair --><p style="font-size:var(--r-office-font);line-height:1.05;margin:0">office</p></div>
  <div class="r-primary-action region control" data-region="primary-action"><!-- lime Explore the priorities button: rebuild the control's chrome from the crop (comp-spec.mjs --crop primary-action); its ink box, border, fill, radius, and label size are the comp's --></div>
  <figure class="r-routes region plate" data-region="routes"><img src="../../../assets/plates/routes.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <div class="r-playbook-ground region chrome" data-region="playbook-ground"><!-- white playbook section background --></div>
  <div class="r-playbook-title region text" data-region="playbook-title"><!-- THE PLAYBOOK navy athletic heading --><p style="line-height:1.05;margin:0">playbook-title</p></div>
  <div class="r-playbook-rule region chrome" data-region="playbook-rule"><!-- thin navy rule --></div>
  <div class="r-play-one region control" data-region="play-one"><!-- 01 Jail & public safety reform arrow and underline: rebuild the control's chrome from the crop (comp-spec.mjs --crop play-one); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-play-two region control" data-region="play-two"><!-- 02 Election accessibility arrow and underline: rebuild the control's chrome from the crop (comp-spec.mjs --crop play-two); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-play-three region control" data-region="play-three"><!-- 03 Healthcare arrow and underline: rebuild the control's chrome from the crop (comp-spec.mjs --crop play-three); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-play-four region control" data-region="play-four"><!-- 04 Education arrow: rebuild the control's chrome from the crop (comp-spec.mjs --crop play-four); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-story-ground region chrome" data-region="story-ground"><!-- very pale blue story strip --></div>
  <div class="r-story-heading region text" data-region="story-heading"><!-- MY STORY varsity heading --><p style="line-height:1.05;margin:0">story-heading</p></div>
  <div class="r-business-link region control" data-region="business-link"><!-- How my business started arrow and thin left divider: rebuild the control's chrome from the crop (comp-spec.mjs --crop business-link); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-politics-link region control" data-region="politics-link"><!-- My journey into politics arrow and thin left divider: rebuild the control's chrome from the crop (comp-spec.mjs --crop politics-link); its ink box, border, fill, radius, and label size are the comp's --></div>
</main>
</body>
</html>
