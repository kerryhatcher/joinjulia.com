name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js for Astro
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Astro site
        run: bun run build
        env:
          SITE_URL: ${{ github.event_name == 'pull_request' && format('https://pr-{0}.joinjulia.pages.dev', github.event.pull_request.number) || 'https://joinjulia.com' }}
          BASE_PATH: /

      - name: Prevent preview indexing
        if: github.event_name == 'pull_request'
        run: |
          printf 'User-agent: *\nDisallow: /\n' > dist/robots.txt
          printf '/*\n  X-Robots-Tag: noindex, nofollow\n' >> dist/_headers

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: build
    # Fork PRs build without deployment credentials. Never use pull_request_target.
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
    environment:
      name: ${{ github.event_name == 'pull_request' && format('preview-pr-{0}', github.event.pull_request.number) || 'production' }}
      url: ${{ steps.deployment.outputs.deployment-url }}
    steps:
      - name: Check out deployment tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Set up Node.js for Wrangler
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: site
          path: dist

      - name: Check deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error::Set the CLOUDFLARE_API_TOKEN repository Actions secret.'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo '::error::Set the CLOUDFLARE_ACCOUNT_ID repository Actions variable.'; exit 1; }

      - name: Deploy to Cloudflare Pages
        id: deployment
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.147.0'
          packageManager: bun
          command: pages deploy dist --project-name=joinjulia --branch=${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'main' }} --commit-hash=${{ github.sha }}

      - name: Record deployment URLs
        env:
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.deployment-url }}
          SITE_URL: ${{ github.event_name == 'pull_request' && format('https://pr-{0}.joinjulia.pages.dev', github.event.pull_request.number) || 'https://joinjulia.com' }}
        run: |
          printf 'Site: %s\n\nDeployment: %s\n' "$SITE_URL" "$DEPLOYMENT_URL" >> "$GITHUB_STEP_SUMMARY"
